{% extends 'master.html' %}

{% block content %}

<section class="listing-page">
    <h1>Explore Topics</h1>
    <p class="subtitle">Discover stories by category.</p>

    <div class="item-list">
        {% for category in categories %}
        <div class="list-item">
            <h2>{{ category.name }}</h2>
        </div>
        {% empty %}
        <p>No categories available yet.</p>
        {% endfor %}
    </div>
</section>

{% endblock %}
